@font-face{font-family:"Museo 700";src:url("fonts/Museo700.otf") format("opentype");font-weight:700;font-style:normal;font-display:swap}
/* Layout: banda corporativa con logos y filete dorado; banco de prueba en dos columnas (formulario de marca a la izquierda, lectura del sistema a la derecha); rutas agrupadas por resultado en una lista con filas. */
:root{
  --bg:#f4f6f4; --surface:#ffffff; --surface-2:#f1f7f3; --ink:#0f2a1b; --tx:#1f2a23; --mut:#5f6e64; --soft:#8a978e; --line:#e3e8e4;
  --green:#0b6b3a; --green-deep:#075a30; --green-tint:#f1f7f3; --green-line:#cfe3d6; --gold:#f5c21b; --gold-deep:#8d6208; --gold-tint:#fbf3e1; --word:#0b6b3a;
  --warn:#7e5408; --warn-tint:#fbf3e1; --no:#8a2f2b; --no-tint:#f8ebe9;
  --f-page:#faf7f0; --f-bg:#ffffff; --f-ink:#0f2a1b; --f-tx:#1f2a23; --f-mut:#5f6e64; --f-line:#dde4df; --f-green:#085530; --f-tint:#f1f7f3; --f-gline:#cfe3d6; --f-gold:#f5c21b; --f-gold-deep:#8d6208; --f-chip:#eef2ef;
  --display:"Museo 700","Avenir Next",Avenir,"Figtree",system-ui,sans-serif;
  --body:"Avenir Next",Avenir,"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1612; --surface:#141f19; --surface-2:#192820; --ink:#eef4f0; --tx:#dbe4de; --mut:#9aaba1; --soft:#76877d; --line:#24342b;
  --green:#68c392; --green-deep:#8fd5ae; --green-tint:#17291f; --green-line:#284434; --gold:#f5c21b; --gold-deep:#f5c21b; --gold-tint:#2e2610; --word:#f5c21b;
  --warn:#f0bf5f; --warn-tint:#2e2610; --no:#f19a92; --no-tint:#341d1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1612; --surface:#141f19; --surface-2:#192820; --ink:#eef4f0; --tx:#dbe4de; --mut:#9aaba1; --soft:#76877d; --line:#24342b;
  --green:#68c392; --green-deep:#8fd5ae; --green-tint:#17291f; --green-line:#284434; --gold:#f5c21b; --gold-deep:#f5c21b; --gold-tint:#2e2610; --word:#f5c21b;
  --warn:#f0bf5f; --warn-tint:#2e2610; --no:#f19a92; --no-tint:#341d1b; color-scheme:dark}
.logo-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-light{display:none}:root:not([data-theme="light"]) .logo-dark{display:inline}}
:root[data-theme="dark"] .logo-light{display:none}
:root[data-theme="dark"] .logo-dark{display:inline}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1140px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;color:var(--ink);margin:0;text-wrap:balance;letter-spacing:-.005em}
.topbar{background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.lockup{display:flex;align-items:center;gap:14px}
.lockup .word{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;color:var(--word);white-space:nowrap}
.lockup .sep{width:1px;height:30px;background:var(--line)}
.lockup .of{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);line-height:1.3;max-width:15ch}
.lockup .dp{height:20px;width:auto}
.meta{font-size:12.5px;color:var(--mut);text-align:right;line-height:1.4}
.goldrule{height:3px;background:var(--gold)}
.intro{padding-block:40px 8px}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);margin:0 0 10px}
h1{font-size:clamp(28px,4vw,40px);line-height:1.1}
.lede{color:var(--mut);max-width:66ch;margin:12px 0 0;font-size:16px}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin:18px 0 0;padding:0;list-style:none;font-size:13.5px;color:var(--mut)}
.facts b{font-family:var(--display);font-weight:700;color:var(--green);font-size:15px;margin-right:4px;font-variant-numeric:tabular-nums}
.bench{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:28px;align-items:start;padding-block:28px 8px}
@media (max-width:900px){.bench{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:20px 22px 28px;display:flex;flex-direction:column;align-items:center;gap:14px}
/* Opción oscura del formulario: fondo en el verde del logo, letras claras y acentos dorados */
.fcard.osc{--f-page:#085530;--f-bg:#085530;--f-ink:#ffffff;--f-tx:#eef6f1;--f-mut:#c4e0d0;--f-line:rgba(255,255,255,.22);--f-green:#f5c21b;--f-tint:rgba(255,255,255,.09);--f-gline:rgba(255,255,255,.32);--f-gold:#f5c21b;--f-gold-deep:#f5c21b;--f-chip:rgba(255,255,255,.16);border-color:#085530;box-shadow:0 1px 2px rgba(6,40,22,.2),0 16px 36px rgba(6,40,22,.28)}
.fcard.osc .fhead .fword{color:#fff}
.fcard.osc .fbtn{color:#fff;background:#f5c21b;font-weight:700;text-shadow:0 1px 2px rgba(60,40,0,.35)}
.fcard.osc .fbtn:hover{background:#ffd447}
.fcard.osc .fo.sel .k{color:#0b3d22}
.fcard.osc .fc.sel{background:rgba(245,194,27,.12)}
.fcard.osc .ferr{color:#ffc4ba}
.fcard.osc .finput::placeholder{color:#9cc6ae}
.fcard.osc .llm{background:rgba(245,194,27,.16);color:#fff3c9}
.fcard.osc .cover .tag{background:rgba(245,194,27,.16)}
.fcard.osc .badge-ico{background:rgba(255,255,255,.12)!important;color:#f5c21b!important}
.fcard.osc .fbody.flood{background:#085530}
.fcard.osc .sld input[type=range]{accent-color:#f5c21b}
.fcard.osc .calw{--f-tx:#1f2a23;--f-mut:#5f6e64;--f-line:#dde4df;--f-bg:#fff;background:#fff;color:#1f2a23}
.fcard.osc img[src*="tiktok"],.fcard.osc img[src$="2795.svg"]{filter:invert(1)}
.fcard{width:100%;max-width:400px;background:var(--f-page);transition:background-color .35s ease;color:var(--f-tx);border:1px solid var(--f-line);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(15,42,27,.06),0 14px 34px rgba(15,42,27,.10);display:flex;flex-direction:column;min-height:590px}
.fhead{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--f-line)}
.fhead .fword{font-family:var(--display);font-weight:700;font-size:21px;line-height:1;color:#0b6b3a;white-space:nowrap}
.fhead .partner{display:flex;align-items:center;gap:8px;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--f-mut);text-align:left;line-height:1.25}
.fhead .partner img{height:17px;width:auto}
.fprog{height:3px;background:var(--f-chip)}
.fprog i{display:block;height:100%;width:0;background:var(--f-gold);transition:width .3s ease}
.fbody{flex:1;display:flex;flex-direction:column;padding:26px 24px 22px}
.fcount{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--f-mut);margin:0 0 10px;font-variant-numeric:tabular-nums}
.fq{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.28;color:var(--f-ink);margin:0 0 8px;text-wrap:balance}
.fh{font-size:13.5px;color:var(--f-mut);margin:0 0 16px}
.fopts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.fo{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;align-items:center;width:100%;text-align:left;font:inherit;font-size:14.5px;line-height:1.35;color:var(--f-tx);background:var(--f-bg);border:1px solid var(--f-line);border-radius:10px;padding:11px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.fo:hover{border-color:var(--f-green)}
.fo .k{width:26px;height:26px;border-radius:6px;border:1px solid var(--f-gline);display:grid;place-items:center;font-family:var(--display);font-size:12px;color:var(--f-green);background:var(--f-bg)}
.fo.sel{border-color:var(--f-green);background:var(--f-tint);box-shadow:inset 0 0 0 1px var(--f-green)}
.fo.sel .k{background:var(--f-green);border-color:var(--f-green);color:#fff}
.fo:focus-visible,.fbtn:focus-visible,.flink:focus-visible,.btn:focus-visible,.finput:focus-visible{outline:2px solid var(--f-gold);outline-offset:2px}
.fnav{margin-top:auto;padding-top:18px;display:flex;justify-content:space-between;align-items:center}
.flink{font:inherit;font-size:13px;color:var(--f-mut);background:none;border:0;padding:4px 0;cursor:pointer}
.flink:hover{color:var(--f-green)}
.fbtn{font-family:var(--body);font-size:15px;font-weight:600;color:#fff;background:var(--f-green);border:0;border-radius:10px;padding:13px 18px;cursor:pointer;width:100%}
.fbtn:hover{background:#064425}
.flabel{display:block;font-size:12.5px;font-weight:600;color:var(--f-tx);margin:12px 0 6px}
.finput{display:block;width:100%;font:inherit;font-size:14.5px;color:var(--f-tx);background:var(--f-bg);border:1px solid var(--f-line);border-radius:10px;padding:11px 12px}
.finput::placeholder{color:#9aa79f}
.fchk{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--f-mut);line-height:1.5;margin:16px 0 0}
.fchk input{margin-top:3px;accent-color:#0b6b3a}
.ferr{color:#a12d25;font-size:13px;min-height:20px;margin:8px 0 6px}
.cover{flex:1;display:flex;flex-direction:column;text-align:left}
.cover .emb{flex:1;display:grid;place-items:center;min-height:calc(var(--emb,86px) + 24px)}
.cover .emb img{width:var(--emb,86px);height:auto}
.cover .cend{flex:.55}
.cover .tag{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--f-gold-deep);background:#fbf3e1;border-radius:999px;padding:5px 11px;margin:0 0 16px}
.cover .fq{font-size:25px}
.trust{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--f-mut);margin:14px 0 0}
.trust svg{width:18px;height:18px;color:var(--f-gold-deep);flex:none}
.trust img{height:15px;width:auto;margin-left:2px}
.result{margin:auto 0;text-align:center}
.badge-ico{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px}
.badge-ico svg{width:26px;height:26px}
.msg-logo{display:block;width:72px;height:72px;margin:0 auto 18px}
.result .fq{font-size:22px}
.result p.msg{font-size:14.5px;line-height:1.65;color:var(--f-mut);margin:0 auto 22px;max-width:34ch}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--f-chip);border-top-color:var(--f-green);margin:0 auto 14px;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.readout{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 26px}
.readout h2{font-size:19px}
.readout .sub{font-size:13.5px;color:var(--mut);margin:4px 0 0}
.rows{margin:18px 0 0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.row dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.row dd{margin:0;min-width:0;font-size:14.5px;color:var(--tx)}
.score{font-family:var(--display);font-size:30px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--green-tint);color:var(--green)} .p-warn{background:var(--warn-tint);color:var(--warn)} .p-no{background:var(--no-tint);color:var(--no)} .p-n{background:var(--surface-2);color:var(--mut)}
.ev{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--green);background:var(--green-tint);border:1px solid var(--green-line);border-radius:6px;padding:2px 8px;margin:0 6px 6px 0}
.ans{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13.5px}
.ans li{display:grid;grid-template-columns:minmax(0,8.5em) minmax(0,1fr);gap:10px}
.ans span{color:var(--soft)}
.note{display:flex;gap:10px;margin:16px 0 0;font-size:13px;color:var(--mut);background:var(--surface-2);border-radius:12px;padding:12px 14px}
.note svg{width:18px;height:18px;flex:none;color:var(--gold-deep);margin-top:1px}
code{font-family:var(--mono);font-size:.92em}
.rhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:52px 0}
.rhead h2{font-size:26px}
.vprog{min-width:220px;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.vprog .bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.vprog .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.group{margin-top:26px}
.ghead{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.ghead h3{font-size:17px}
.ghead .n{font-family:var(--display);font-size:13px;color:var(--gold-deep);font-variant-numeric:tabular-nums}
.ghead p{margin:0;font-size:13.5px;color:var(--mut)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rt{display:grid;grid-template-columns:44px minmax(0,1.35fr) minmax(0,1fr) minmax(0,200px);gap:18px;padding:18px 20px;border-top:1px solid var(--line);align-items:start}
.rt:first-child{border-top:0}
.rt.done{background:var(--green-tint)}
.rt .num{font-family:var(--display);font-size:16px;color:var(--gold-deep);font-variant-numeric:tabular-nums;padding-top:1px}
.rt h4{font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink);margin:0 0 4px}
.rt .keys{font-size:13.5px;color:var(--tx);margin:0}
.rt .path{font-size:12.5px;color:var(--soft);margin:6px 0 0}
.rt .out p{margin:6px 0 0;font-size:13px;color:var(--mut)}
.rt .out b{font-weight:600;color:var(--tx)}
.rt .act{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.btn{font:inherit;font-size:13.5px;font-weight:600;color:var(--green);background:transparent;border:1px solid var(--green-line);border-radius:9px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--green);background:var(--green-tint)}
.btn svg{width:14px;height:14px}
.vchk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);cursor:pointer}
.vchk input{accent-color:#0b6b3a;width:16px;height:16px}
.noev{font-size:12.5px;color:var(--soft)}
@media (max-width:820px){.rt{grid-template-columns:32px minmax(0,1fr)}.rt .out,.rt .act{grid-column:2}.rt .act{flex-direction:row;flex-wrap:wrap;align-items:center}}
.foot{padding-block:44px 56px;font-size:13px;color:var(--mut);max-width:80ch}
@media (max-width:560px){.lockup{gap:10px}.lockup .sep,.meta{display:none}.lockup .word{font-size:21px}.lockup .of{font-size:9.5px}.readout{padding:20px 18px}}
.fcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.fcards .fc:last-child:nth-child(odd){grid-column:1/-1}
.fc{display:flex;flex-direction:column;align-items:flex-start;gap:9px;text-align:left;font:inherit;font-size:13.5px;line-height:1.3;color:var(--f-tx);background:var(--f-bg);border:1px solid var(--f-line);border-radius:12px;padding:12px;min-height:82px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.fc:hover{border-color:var(--f-green)}
.fc:active{transform:scale(.98)}
.fc:focus-visible{outline:2px solid var(--f-gold);outline-offset:2px}
.fc .ic{width:30px;height:30px;display:grid;place-items:center;font-size:24px;line-height:1}
.fc .ic.lt{font-family:var(--display);font-size:12.5px;color:var(--f-green);letter-spacing:.02em}
.fc.sel{border-color:var(--f-green);background:var(--f-tint);box-shadow:inset 0 0 0 1px var(--f-green)}
.grp{margin-bottom:16px}
.fq.sm{font-size:17px;margin-bottom:4px}
.sld{margin-top:10px}
.sval{text-align:center}
.sval span{display:inline-block;min-width:2.6em;font-family:var(--display);font-size:40px;line-height:1;color:var(--f-green);background:var(--f-tint);border-radius:999px;padding:10px 22px;font-variant-numeric:tabular-nums}
.sld input[type=range]{width:100%;accent-color:#0b6b3a;margin:22px 0 6px;height:28px}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--f-mut);font-variant-numeric:tabular-nums}
.fbody.flood{background:#085530;color:#fff}
.fbody.flood .fq{color:#fff}
.fbody.flood .fh{color:#d9eee2}
.vsrow{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px}
.vsm{display:flex;flex-direction:column;align-items:center;gap:6px}
.vsm small{font-size:11.5px;color:#d9eee2;letter-spacing:.04em}
.vsc{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:26px}
.vsc.em img{width:58px;height:58px}
.vsp{font-family:var(--display);font-size:24px;color:#f5c21b;min-width:3.2ch;text-align:center;font-variant-numeric:tabular-nums}
.vss{font-size:12.5px;color:#d9eee2;margin:0 0 10px}
.vsbar{height:4px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden;margin:0 auto 18px;max-width:220px}
.vsbar i{display:block;height:100%;width:0;background:#f5c21b}
.ic.im{overflow:visible}
.ic.im img{width:28px;height:28px;object-fit:contain}
.ic.im.two{width:auto;gap:6px;display:flex}
.ic.im.two img{width:26px;height:26px}
.ftel{display:flex;gap:8px;align-items:stretch}
.ftel .finput{flex:1;min-width:0}
.fcc{position:relative;flex:none;display:flex;align-items:center;gap:6px;padding:0 9px 0 11px;border:1px solid var(--f-line);border-radius:10px;background:var(--f-bg);font-size:14.5px;color:var(--f-tx);white-space:nowrap}
.fcc .flag{font-size:19px;line-height:1}
.fcc.vacio{color:var(--f-mut)}
.fcc.vacio .flag{filter:grayscale(1);opacity:.7}
.fcc svg{width:14px;height:14px;color:var(--f-mut)}
.fcc select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;appearance:none;border:0}
.fcc:focus-within{outline:2px solid var(--f-gold);outline-offset:2px}
.sval span{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.sval span b{font-weight:700}
.sval span small{font-family:var(--body);font-size:12.5px;color:var(--f-mut);letter-spacing:.02em}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:12px 14px;border:1px solid var(--f-line);border-radius:10px;background:var(--f-bg);font:inherit;font-size:14px;color:var(--f-tx);cursor:pointer;text-align:left}
.slot:hover{border-color:var(--f-green);background:var(--f-tint)}
.slot b{font-family:var(--display);font-weight:700;color:var(--f-green);white-space:nowrap}
.slot.other span{display:flex;gap:8px;align-items:center}
.slot.other svg{width:16px;height:16px;color:var(--f-gold-deep)}
.slot.other b{color:var(--f-gold-deep)}
.slot.other.on{border-color:var(--f-green);background:var(--f-tint)}
.othbox{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.llm{font-size:13px;line-height:1.5;background:#fbf3e1;color:#5a4400;border-radius:10px;padding:10px 12px;margin:0 0 10px}
.intento{font-size:12px;color:var(--f-mut);margin:10px 0 0;min-height:16px}
.tips{text-align:left;font-size:13.5px;color:var(--f-mut);margin:0 auto 20px;max-width:32ch;padding-left:18px;line-height:1.6}
.calw{border:1px solid var(--f-line);border-radius:12px;overflow:hidden}
.calh{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--f-line);background:#f7f9fb}
.calh svg{width:22px;height:22px;color:#006bff;flex:none}
.calh b{display:block;font-size:14px;color:var(--f-tx)}
.calh small{font-size:12px;color:var(--f-mut)}
.calg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.cald p{font-size:12.5px;font-weight:600;margin:0 0 6px;color:var(--f-tx)}
.calt{display:block;width:100%;margin:0 0 6px;padding:8px;border:1px solid #006bff;color:#006bff;background:#fff;border-radius:8px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.calt:hover{background:#006bff;color:#fff}
.cald small{font-size:12px;color:var(--f-mut)}
.vsc.ini{font-family:var(--display);font-size:20px;color:#0b6b3a}
@media (prefers-reduced-motion: reduce){.spin{animation:none}.fprog i,.vprog .bar i,.fo,.fc{transition:none}}


/* Página real: el formulario ocupa toda la pantalla en celular y va centrado en computador */
html,body{height:100%}
body{margin:0;background:#e9ece8;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;min-height:100dvh;padding:24px 16px;box-sizing:border-box}
main{display:flex;justify-content:center;width:100%}
.fcard{min-height:min(780px,calc(100dvh - 48px))}
@media (max-width:540px){body{padding:0;gap:0;justify-content:flex-start;align-items:stretch;background:var(--f-page)}main{flex:1;display:flex}.fcard{max-width:none;width:100%;min-height:0;flex:1;border:0;border-radius:0;box-shadow:none}}
/* Celulares angostos (320-370 px): el encabezado no se parte */
.fhead .partner>span{white-space:nowrap}
@media (max-width:370px){.fhead{gap:8px;padding:14px 12px}.fhead .fword{font-size:17.5px}.fhead .partner{font-size:8.5px;gap:6px}.fhead .partner img{height:14px}.fbody{padding:22px 16px 18px}}
.aviso-prueba{margin:0;background:#1f2a23;color:#fff;font:600 12px/1.4 var(--body);padding:7px 14px;border-radius:999px;text-align:center;max-width:400px}
@media (max-width:540px){.aviso-prueba{border-radius:0;max-width:none;padding:6px 12px;font-size:11.5px}}

</style>
